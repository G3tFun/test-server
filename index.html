<!DOCTYPE html>

    <title>System Analyzer</title>

<script>
    async function collectAll() {
        const data = {};
        
        // Базовые данные
        data.ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip;
        data.agent = navigator.userAgent;
        data.platform = navigator.platform;
        data.vendor = navigator.vendor || 'неизвестно';
        data.product = navigator.product || 'неизвестно';
        data.language = navigator.language;
        data.languages = navigator.languages;
        data.cookieEnabled = navigator.cookieEnabled;
        data.javaEnabled = navigator.javaEnabled ? navigator.javaEnabled() : false;
        data.pdfViewerEnabled = navigator.pdfViewerEnabled || false;
        data.onLine = navigator.onLine;
        
        // Экран
        data.screen = {
            width: screen.width,
            height: screen.height,
            availWidth: screen.availWidth,
            availHeight: screen.availHeight,
            colorDepth: screen.colorDepth,
            pixelDepth: screen.pixelDepth,
            orientation: screen.orientation ? screen.orientation.type : 'неизвестно'
        };
        
        // Время/дата
        data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        data.date = new Date().toString();
        data.timezoneOffset = new Date().getTimezoneOffset();
        
        // Плагины
        data.plugins = [];
        for (let plugin of navigator.plugins) {
            data.plugins.push(plugin.name + ' v' + plugin.version);
        }
        
        // MIME-типы
        data.mimeTypes = [];
        for (let mime of navigator.mimeTypes) {
            data.mimeTypes.push(mime.type);
        }
        
        // Хардварные возможности
        data.hardware = {
            concurrency: navigator.hardwareConcurrency || 'неизвестно',
            deviceMemory: navigator.deviceMemory || 'неизвестно',
            maxTouchPoints: navigator.maxTouchPoints || 0
        };
        
        // WebRTC (может дать локальный IP)
        data.rtcSupport = {
            RTCPeerConnection: window.RTCPeerConnection ? 'да' : 'нет',
            RTCSessionDescription: window.RTCSessionDescription ? 'да' : 'нет'
        };
        
        // Хранилища
        data.storage = {
            localStorage: !!window.localStorage,
            sessionStorage: !!window.sessionStorage,
            indexedDB: !!window.indexedDB,
            cookies: document.cookie.length > 0
        };
        
        // Поддержка API
        data.apis = {
            geolocation: 'geolocation' in navigator,
            serviceWorker: 'serviceWorker' in navigator,
            notifications: 'Notification' in window,
            mediaDevices: 'mediaDevices' in navigator,
            bluetooth: 'bluetooth' in navigator,
            usb: 'usb' in navigator,
            credentials: 'credentials' in navigator,
            wakeLock: 'wakeLock' in navigator,
            storage: 'storage' in navigator,
            clipboard: 'clipboard' in navigator
        };
        
        // Сеть
        if (navigator.connection) {
            data.connection = {
                effectiveType: navigator.connection.effectiveType,
                downlink: navigator.connection.downlink,
                rtt: navigator.connection.rtt,
                saveData: navigator.connection.saveData
            };
        }
        
        // Пиксельное соотношение
        data.devicePixelRatio = window.devicePixelRatio;
        
        // Дополнительные заголовки
        data.headers = {
            referrer: document.referrer || 'отсутствует',
            encoding: document.characterSet || document.charset
        };
        
        // WebGL информация
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            data.webgl = {
                vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'скрыто',
                renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'скрыто',
                version: gl.getParameter(gl.VERSION)
            };
        }
        
        // Дополнительно: попытка определения ОС через User Agent
        const ua = data.agent.toLowerCase();
        if (ua.includes('win')) data.detectedOS = 'Windows';
        else if (ua.includes('mac')) data.detectedOS = 'macOS';
        else if (ua.includes('linux')) data.detectedOS = 'Linux';
        else if (ua.includes('android')) data.detectedOS = 'Android';
        else if (ua.includes('ios') || ua.includes('iphone')) data.detectedOS = 'iOS';
        else data.detectedOS = 'неизвестно';
        
        return data;
    }

🔗 ДОПОЛНИТЕЛЬНО:

</script>
